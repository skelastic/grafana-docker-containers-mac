server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /var/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# TSDB storage (single-node, filesystem "object store")
storage_config:
  filesystem:
    directory: /var/loki/tsdb   # acts as the local object store bucket
  tsdb_shipper:
    active_index_directory: /var/loki/tsdb-index
    cache_location: /var/loki/tsdb-cache

schema_config:
  configs:
    - from: 2025-08-19
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# (TSDB supports structured metadata, so NO limits override needed)
limits_config:
  ingestion_rate_strategy: global
  # Allow really old data (120 days back)
  max_global_streams_per_user: 0
  max_concurrent_tail_requests: 20
  reject_old_samples: false
  reject_old_samples_max_age: 8760h
  max_line_size: 0
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  retention_period: 2880h
  max_query_lookback: 3000h
  max_cache_freshness_per_query: 10m
  creation_grace_period: 300s

ruler:
  rule_path: /tmp/loki/rules
  storage:
    type: local
    local:
      directory: /var/loki/rules
  ring:
    kvstore:
      store: inmemory
  enable_api: true