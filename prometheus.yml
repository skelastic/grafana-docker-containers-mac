global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "local-docker"

remote_write:
  - url: "http://mimir:9009/api/v1/push"
    headers:
      X-Scope-OrgID: 'demo-00'
    queue_config:
      capacity: 5000
      max_shards: 10
      max_samples_per_send: 2000
      batch_send_deadline: 5s
    metadata_config:
      send: true

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # --- Tempo metrics ---
  - job_name: "tempo"
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          job: tempo
          instance: tempo-1

  - job_name: "mimir"
    static_configs:
      - targets: ["mimir:9009"]
